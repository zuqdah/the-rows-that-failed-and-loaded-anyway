[project]
name = "the-rows-that-failed-and-loaded-anyway"
version = "0"
description = "A Lakeflow declarative pipeline that reported success while loading every row that violated its own declared expectations."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
# BLE001 is deliberately not selected: several places here catch bare Exception
# on purpose, because a call that failed for any reason at all means "not
# measured", and the grader needs that to arrive as None rather than as a crash.

# No per-file-ignores. The pipeline module relies on `spark` being injected by
# the Databricks runtime, and the two lines that do so carry their own inline
# noqa. A blanket per-file ignore for F821 was tried first and made those inline
# directives redundant, which ruff correctly reported as unused noqa -- a
# file-wide ignore would also hide a genuine undefined name in the same file.
