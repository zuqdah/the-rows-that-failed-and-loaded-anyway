name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4 ruff==0.8.4

      # Two things have to be true before a clean lint means anything: the
      # linter has to run, and it has to be capable of failing. A tool that
      # exits 0 because it scanned nothing reads exactly like clean code, and
      # this repository has been bitten by that before -- on four PowerShell
      # labs, where PSScriptAnalyzer crashed on its first invocation and
      # reported zero findings.
      - name: Prove the linter works, then lint
        run: |
          set -euo pipefail
          ruff --version
          mkdir -p /tmp/canary
          cat > /tmp/canary/canary.py <<'PY'
          import os


          def canary():
              unused = "deliberate"
              return 1
          PY
          if ruff check --isolated --select F /tmp/canary/canary.py; then
            echo "The linter reported no problem with code carrying an unused import"
            echo "and an unused variable. A clean result on real code would prove"
            echo "nothing, so this fails rather than continuing."
            exit 1
          fi
          echo "Canary caught it. The linter is working."
          ruff check .

      - name: Test
        run: pytest -v

      # The matrix is the yardstick. An incoherent one would leave the drill
      # unfalsifiable while its report still looked rigorous, so it is checked
      # here rather than after provisioning a pipeline.
      - name: Check the matrix is coherent
        run: python scripts/check_matrix.py

  actions:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
